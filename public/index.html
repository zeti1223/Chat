<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PIN Code Chat</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1877f2" />
    <meta name="description" content="PIN code protected chat application" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chat" />
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .message.swiping {
            transition: transform 0.1s ease-out;
        }

        .message.swiping .swipe-indicator {
            opacity: 1;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0s;
        }
    </style>
</head>

<body
    class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans h-[100dvh] flex items-center justify-center overflow-hidden transition-colors duration-300 touch-manipulation">
    <div class="container w-full h-full flex flex-col relative">
        <!-- PIN Képernyő -->
        <div id="pin-screen"
            class="flex flex-col items-center justify-center w-full max-w-md mx-auto p-8 bg-white dark:bg-gray-800 rounded-xl shadow-xl transition-colors duration-300">
            <h1 class="text-3xl font-bold mb-6 text-teal-600 dark:text-teal-400">Join Room</h1>
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="pin-input" placeholder="Enter 6-digit PIN code"
                maxlength="6"
                class="w-full p-3 mb-4 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg text-center text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all" />
            <button id="join-btn"
                class="w-full p-3 rounded-lg bg-teal-600 text-white font-bold hover:bg-teal-700 transition-colors shadow-md">Join</button>
            <div id="new-room-container" class="w-full mt-4">
                <button id="new-room-btn"
                    class="w-full p-3 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors font-semibold">
                    Create New Chat Room
                </button>
            </div>
        </div>

        <!-- Felhasználónév Képernyő -->
        <div id="username-screen"
            class="hidden flex flex-col items-center justify-center w-full max-w-md mx-auto p-8 bg-white dark:bg-gray-800 rounded-xl shadow-xl transition-colors duration-300">
            <h1 class="text-2xl font-bold mb-6">Enter your name</h1>
            <input type="text" id="username-input" placeholder="Username"
                class="w-full p-3 mb-4 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg text-center text-lg focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all" />
            <button id="enter-chat-btn"
                class="w-full p-3 rounded-lg bg-teal-600 text-white font-bold hover:bg-teal-700 transition-colors shadow-md">Enter
                Chat</button>
        </div>

        <!-- Chat Képernyő -->
        <div id="chat-screen" class="hidden flex flex-col w-full h-full bg-white dark:bg-gray-800">
            <div
                class="chat-header flex justify-between items-center p-4 pt-[calc(1rem+env(safe-area-inset-top))] bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm border-b border-gray-200 dark:border-gray-700 shadow-sm z-10">
                <h1 class="text-xl font-bold text-teal-600 dark:text-teal-400">Chat Room</h1>
                <div class="header-right flex items-center gap-2">
                    <button id="logout-btn"
                        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-xl"
                        title="Logout">🚪</button>
                    <button id="theme-toggle-btn"
                        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-xl"
                        title="Toggle Theme">
                        🌙
                    </button>
                    <button id="notification-btn"
                        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors text-xl"
                        title="Enable Notifications">
                        🔕
                    </button>
                    <div id="pin-display"
                        class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 font-mono font-bold py-1 px-3 rounded cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors select-none"
                        title="Click to copy PIN">PIN: ------</div>
                </div>
            </div>
            <div id="messages"
                class="flex-grow p-4 overflow-y-auto overscroll-contain bg-gray-50 dark:bg-gray-900 space-y-4 pb-[env(safe-area-inset-bottom,0)]">
            </div>
            <!-- Typing indicator will be inserted here -->
            <div id="typing-indicator"
                class="flex items-center bg-gray-200 dark:bg-gray-700 rounded-2xl px-4 py-2 w-fit mb-4 ml-4 hidden shadow-sm">
                <span class="text-sm text-gray-600 dark:text-gray-300 mr-2"></span>
                <div class="typing-dot w-2 h-2 bg-gray-500 rounded-full mx-0.5 animate-bounce"></div>
                <div class="typing-dot w-2 h-2 bg-gray-500 rounded-full mx-0.5 animate-bounce"></div>
                <div class="typing-dot w-2 h-2 bg-gray-500 rounded-full mx-0.5 animate-bounce"></div>
            </div>
            <!-- Reply preview will be inserted here when replying -->
            <div id="reply-preview"
                class="flex items-center gap-2 p-3 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-400 text-sm hidden"
                aria-hidden="true">
                <div id="reply-preview-text" class="flex-grow truncate"></div>
                <button id="reply-cancel" class="text-gray-500 hover:text-red-500 transition-colors"
                    title="Cancel reply">
                    ✖
                </button>
            </div>
            <form id="message-form"
                class="flex items-center p-3 gap-2 border-t border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 pb-[calc(0.75rem+env(safe-area-inset-bottom,0))]">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off"
                    class="flex-grow bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white rounded-full px-5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all" />
                <button type="submit" id="send-btn"
                    class="text-teal-600 hover:text-teal-700 text-2xl p-3 transition-colors flex items-center justify-center w-12 h-12 active:scale-95 transform">➤</button>
            </form>
        </div>
    </div>

    <script>
        // Firebase konfiguráció
        const firebaseConfig = {
            apiKey: "AIzaSyD_uCiW032hxeqBbKO0BoccZPyoDdOOzh0",
            authDomain: "chat-zeteny.firebaseapp.com",
            databaseURL:
                "https://chat-zeteny-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chat-zeteny",
            storageBucket: "chat-zeteny.firebasestorage.app",
            messagingSenderId: "436138544600",
            appId: "1:436138544600:web:3ed28e02ec634b31a2b6ad",
        };

        // Firebase inicializálása
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // DOM Elemek
        const pinScreen = document.getElementById("pin-screen");
        const usernameScreen = document.getElementById("username-screen");
        const chatScreen = document.getElementById("chat-screen");

        const pinInput = document.getElementById("pin-input");
        const joinBtn = document.getElementById("join-btn");
        const newRoomBtn = document.getElementById("new-room-btn");

        const usernameInput = document.getElementById("username-input");
        const enterChatBtn = document.getElementById("enter-chat-btn");

        const pinDisplay = document.getElementById("pin-display");
        const messagesContainer = document.getElementById("messages");
        const messageForm = document.getElementById("message-form");
        const messageInput = document.getElementById("message-input");
        const themeToggleBtn = document.getElementById("theme-toggle-btn");
        const notificationBtn = document.getElementById("notification-btn");
        const logoutBtn = document.getElementById("logout-btn");

        // Alkalmazás állapota
        let currentPin = null;
        let currentUsername = null;
        let messagesRef = null;
        let typingRef = null;
        let typingListenRef = null;
        let typingTimeout = null;
        let currentReply = null; // { username, text }
        let notificationsEnabled = false;
        const appStartTime = Date.now();

        // --- Téma Kezelés ---
        function applyTheme(theme) {
            if (theme === "dark") {
                document.documentElement.classList.add("dark");
                themeToggleBtn.textContent = "☀️";
            } else {
                document.documentElement.classList.remove("dark");
                themeToggleBtn.textContent = "🌙";
            }
        }

        themeToggleBtn.addEventListener("click", () => {
            const isDarkMode = document.documentElement.classList.contains("dark");
            const newTheme = isDarkMode ? "light" : "dark";
            localStorage.setItem("theme", newTheme);
            applyTheme(newTheme);
        });

        // --- Értesítés Kezelés ---
        function initNotifications() {
            if (!notificationBtn) {
                return;
            }

            if (!("Notification" in window)) {
                notificationBtn.disabled = true;
                notificationBtn.textContent = "🚫";
                notificationBtn.title = "Browser does not support notifications.";
                return;
            }

            const savedPref = localStorage.getItem("chatNotifications");
            if (savedPref === "enabled" && Notification.permission === "granted") {
                notificationsEnabled = true;
            }
            updateNotificationButton();

            notificationBtn.addEventListener("click", () => {
                if (Notification.permission === "granted") {
                    notificationsEnabled = !notificationsEnabled;
                    localStorage.setItem(
                        "chatNotifications",
                        notificationsEnabled ? "enabled" : "disabled",
                    );
                    updateNotificationButton();
                    if (notificationsEnabled) {
                        showNotificationPreview();
                    }
                    return;
                }

                if (Notification.permission === "denied") {
                    alert(
                        "Notifications are disabled in browser settings. Please enable them.",
                    );
                    return;
                }

                Notification.requestPermission().then((permission) => {
                    if (permission === "granted") {
                        notificationsEnabled = true;
                        localStorage.setItem("chatNotifications", "enabled");
                        updateNotificationButton();
                        showNotificationPreview();
                    } else {
                        notificationsEnabled = false;
                        localStorage.setItem("chatNotifications", "disabled");
                        updateNotificationButton();
                    }
                });
            });
        }

        function updateNotificationButton() {
            if (!notificationBtn || !("Notification" in window)) {
                return;
            }
            notificationBtn.textContent = notificationsEnabled ? "🔔" : "🔕";
            notificationBtn.title = notificationsEnabled
                ? "Értesítések kikapcsolása"
                : "Értesítések bekapcsolása";
            notificationBtn.setAttribute(
                "aria-pressed",
                notificationsEnabled ? "true" : "false",
            );
        }

        function showNotificationPreview() {
            if (
                !("Notification" in window) ||
                Notification.permission !== "granted"
            ) {
                return;
            }
            try {
                const preview = new Notification("Értesítések engedélyezve", {
                    body: "Értesítést kapsz az új üzenetekről.",
                    tag: "chat-notification-preview",
                });
                setTimeout(() => preview.close(), 4000);
            } catch (err) {
                console.warn("Nem sikerült előnézeti értesítést küldeni:", err);
            }
        }

        // --- Munkamenet Kezelés ---
        document.addEventListener("DOMContentLoaded", () => {
            // Téma betöltése (default: dark)
            const savedTheme = localStorage.getItem("theme") || "dark";
            applyTheme(savedTheme);

            initNotifications();

            // Munkamenet betöltése
            const savedPin = localStorage.getItem("chatPin");
            const savedUsername = localStorage.getItem("chatUsername");

            if (savedPin && savedUsername) {
                currentPin = savedPin;
                currentUsername = savedUsername;
                showChatScreen();
            } else {
                pinScreen.classList.remove("hidden");
            }
        });

        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("chatPin");
            localStorage.removeItem("chatUsername");
            location.reload();
        });

        // --- Eseménykezelők ---

        // PIN másolása - PIN-re kattintás (mobilon is működik)
        pinDisplay.addEventListener("click", async () => {
            if (!currentPin) return;

            const originalText = pinDisplay.textContent;

            // Modern Clipboard API (ha elérhető)
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(currentPin);
                    pinDisplay.textContent = "✅ Copied!";
                    setTimeout(() => {
                        pinDisplay.textContent = originalText;
                    }, 2000);
                    return;
                } catch (err) {
                    console.warn("Clipboard API hiba, fallback használata:", err);
                }
            }

            // Fallback módszer mobilon (régebbi böngészők, iOS Safari)
            try {
                // Létrehozunk egy ideiglenes textarea elemet
                const textArea = document.createElement("textarea");
                textArea.value = currentPin;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                textArea.style.top = "-999999px";
                textArea.setAttribute("readonly", "");
                document.body.appendChild(textArea);

                // Kiválasztjuk és másoljuk
                textArea.select();
                textArea.setSelectionRange(0, currentPin.length);

                // iOS Safari támogatás
                const successful = document.execCommand("copy");
                document.body.removeChild(textArea);

                if (successful) {
                    pinDisplay.textContent = "✅ Copied!";
                    setTimeout(() => {
                        pinDisplay.textContent = originalText;
                    }, 2000);
                } else {
                    throw new Error("execCommand copy sikertelen");
                }
            } catch (err) {
                console.error("PIN másolás hiba:", err);
                // Ha mindkét módszer sikertelen, mutassuk a PIN-t egy alert-ben
                const userConfirmed = confirm(
                    `PIN code: ${currentPin}\n\nCould not copy automatically. Click OK to copy manually.`,
                );
                if (userConfirmed) {
                    // Próbáljuk meg újra a clipboard API-t
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        try {
                            await navigator.clipboard.writeText(currentPin);
                            pinDisplay.textContent = "✅ Copied!";
                            setTimeout(() => {
                                pinDisplay.textContent = originalText;
                            }, 2000);
                        } catch (e) {
                            pinDisplay.textContent = "📋 Click PIN";
                            setTimeout(() => {
                                pinDisplay.textContent = originalText;
                            }, 3000);
                        }
                    }
                }
            }
        });

        // Válasz megszakítása
        const replyPreview = document.getElementById("reply-preview");
        const replyPreviewText = document.getElementById("reply-preview-text");
        const replyCancelBtn = document.getElementById("reply-cancel");
        replyCancelBtn.addEventListener("click", () => {
            clearReply();
        });

        // Új szoba létrehozása
        newRoomBtn.addEventListener("click", () => {
            currentPin = Math.floor(100000 + Math.random() * 900000).toString();
            showUsernameScreen();
        });

        // Csatlakozás meglévő szobához
        joinBtn.addEventListener("click", () => {
            const pin = pinInput.value;
            if (pin.length === 6 && /^\d{6}$/.test(pin)) {
                currentPin = pin;
                showUsernameScreen();
            } else {
                alert("Please enter a valid 6-digit PIN code.");
            }
        });

        // Belépés a chatbe a felhasználónév megadása után
        enterChatBtn.addEventListener("click", () => {
            const username = usernameInput.value.trim();
            if (username) {
                currentUsername = username;
                // Munkamenet mentése
                localStorage.setItem("chatPin", currentPin);
                localStorage.setItem("chatUsername", currentUsername);
                showChatScreen();
            } else {
                alert("Please enter a username.");
            }
        });

        // Üzenet küldése
        messageForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text && messagesRef) {
                const payload = {
                    username: currentUsername,
                    text: text,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                };
                if (currentReply) {
                    payload.replyToUsername = currentReply.username;
                    payload.replyToText = currentReply.text;
                }
                messagesRef.push(payload);
                messageInput.value = "";
                clearReply();
            }
        });

        // --- Segédfüggvények ---

        function showUsernameScreen() {
            pinScreen.classList.add("hidden");
            document.getElementById("new-room-container").classList.add("hidden");
            usernameScreen.classList.remove("hidden");
        }

        function showChatScreen() {
            pinScreen.classList.add("hidden");
            usernameScreen.classList.add("hidden");
            chatScreen.classList.remove("hidden");
            pinDisplay.textContent = `PIN: ${currentPin}`;

            // Üzenetek betöltése
            loadMessages();

            // Billentyűzet kezelés mobilon
            if (isMobileDevice()) {
                setupKeyboardHandling();
            }
        }

        // Virtuális billentyűzet kezelése mobilon
        function setupKeyboardHandling() {
            const calculateMessagesHeight = () => {
                const header = chatScreen.querySelector(".chat-header");
                const headerHeight = header ? header.offsetHeight : 0;
                const formHeight = messageForm.offsetHeight;
                const replyHeight = replyPreview.classList.contains("hidden")
                    ? 0
                    : replyPreview.offsetHeight;
                return { headerHeight, formHeight, replyHeight };
            };

            // Visual Viewport API használata (ha elérhető)
            if (window.visualViewport) {
                const handleViewportChange = () => {
                    const viewport = window.visualViewport;
                    const viewportHeight = viewport.height;
                    const windowHeight = window.innerHeight;
                    const keyboardHeight = windowHeight - viewportHeight;

                    if (keyboardHeight > 150) {
                        // Billentyűzet látható - állítsuk be a messages container magasságát
                        const { headerHeight, formHeight, replyHeight } =
                            calculateMessagesHeight();
                        messagesContainer.style.height = `${viewportHeight - headerHeight - formHeight - replyHeight}px`;
                        messagesContainer.style.maxHeight = "none";
                        // Scroll az aljára
                        setTimeout(() => {
                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        }, 100);
                    } else {
                        // Billentyűzet eltűnt - reset
                        messagesContainer.style.height = "";
                        messagesContainer.style.maxHeight = "";
                    }
                };

                window.visualViewport.addEventListener(
                    "resize",
                    handleViewportChange,
                );
                window.visualViewport.addEventListener(
                    "scroll",
                    handleViewportChange,
                );
            } else {
                // Fallback: window resize esemény
                let lastHeight = window.innerHeight;
                window.addEventListener("resize", () => {
                    const currentHeight = window.innerHeight;
                    const heightDiff = lastHeight - currentHeight;

                    if (heightDiff > 150) {
                        // Billentyűzet megjelenés
                        const { headerHeight, formHeight, replyHeight } =
                            calculateMessagesHeight();
                        messagesContainer.style.height = `${currentHeight - headerHeight - formHeight - replyHeight}px`;
                        messagesContainer.style.maxHeight = "none";
                        setTimeout(() => {
                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        }, 100);
                    } else if (heightDiff < -150) {
                        // Billentyűzet eltűnés
                        messagesContainer.style.height = "";
                        messagesContainer.style.maxHeight = "";
                    }

                    lastHeight = currentHeight;
                });
            }

            // Input focus esemény - scroll az aljára
            messageInput.addEventListener("focus", () => {
                setTimeout(() => {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 300);
            });

            // Reply preview megjelenésekor is frissítsük a magasságot
            const observer = new MutationObserver(() => {
                if (window.visualViewport) {
                    const viewport = window.visualViewport;
                    const keyboardHeight = window.innerHeight - viewport.height;
                    if (keyboardHeight > 150) {
                        const { headerHeight, formHeight, replyHeight } =
                            calculateMessagesHeight();
                        messagesContainer.style.height = `${viewport.height - headerHeight - formHeight - replyHeight}px`;
                        setTimeout(() => {
                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        }, 100);
                    }
                }
            });
            observer.observe(replyPreview, {
                attributes: true,
                attributeFilter: ["class"],
            });
        }

        function loadMessages() {
            if (messagesRef) {
                messagesRef.off(); // Előző listener eltávolítása
            }
            messagesRef = database.ref(`chats/${currentPin}/messages`);

            messagesRef.on("child_added", (snapshot) => {
                const message = snapshot.val();
                displayMessage(message);
            });

            // Typing presence refs
            if (typingListenRef) {
                typingListenRef.off();
            }
            typingListenRef = database.ref(`chats/${currentPin}/typing`);
            typingListenRef.on("value", (snap) => {
                const val = snap.val() || {};
                const otherTyping = Object.keys(val).filter(
                    (u) => u !== currentUsername && val[u],
                );
                const typingIndicator = document.getElementById("typing-indicator");
                const typingTextSpan = typingIndicator.querySelector("span");
                if (otherTyping.length) {
                    typingTextSpan.textContent = `${otherTyping[0]} is typing`; // "..." will be handled by dots
                    typingIndicator.classList.remove("hidden");
                } else {
                    typingTextSpan.textContent = "";
                    typingIndicator.classList.add("hidden");
                }
            });
        }

        function maybeShowNotification(message) {
            if (!("Notification" in window)) return;
            if (!notificationsEnabled) return;
            if (!message || message.username === currentUsername) return;
            if (Notification.permission !== "granted") return;

            if (message.timestamp && message.timestamp <= appStartTime) return;

            if (document.visibilityState === "visible") {
                return;
            }

            const bodyText =
                message.text.length > 100
                    ? `${message.text.slice(0, 97)}…`
                    : message.text;
            try {
                const notification = new Notification(
                    `New message — ${message.username}`,
                    {
                        body: bodyText,
                        tag: `chat-${currentPin}`,
                    },
                );
                notification.onclick = () => {
                    window.focus();
                    notification.close();
                };
                setTimeout(() => notification.close(), 6000);
            } catch (err) {
                console.warn("Nem sikerült értesítést küldeni:", err);
            }

            if ("vibrate" in navigator) {
                navigator.vibrate([80, 40, 80]);
            }
        }

        function isMobileDevice() {
            return /Android|iPhone|iPad|iPod|Mobile/i.test(
                navigator.userAgent || "",
            );
        }

        // Typing indicator: update presence when the user types
        messageInput.addEventListener("input", () => {
            if (!currentPin || !currentUsername) return;
            if (!typingRef) {
                typingRef = database.ref(
                    `chats/${currentPin}/typing/${currentUsername}`,
                );
                typingRef.onDisconnect().set(false);
            }

            const val = messageInput.value.trim();
            if (val.length) {
                typingRef.set(true);
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    typingRef.set(false);
                }, 2000);
            } else {
                typingRef.set(false);
            }
        });

        // Clear typing presence on unload
        window.addEventListener("beforeunload", () => {
            if (currentPin && currentUsername) {
                const tRef = database.ref(
                    `chats/${currentPin}/typing/${currentUsername}`,
                );
                tRef.set(false);
            }
        });

        function displayMessage(message) {
            const isOwn = message.username === currentUsername;

            const messageDiv = document.createElement("div");
            messageDiv.className = `message flex flex-col mb-4 relative touch-pan-y ${isOwn ? "items-end" : "items-start"}`;

            // Swipe indicator (csak mobilon, minden üzenetre)
            if (isMobileDevice()) {
                const swipeIndicator = document.createElement("div");
                swipeIndicator.className = `swipe-indicator absolute top-1/2 -translate-y-1/2 bg-teal-600 text-white px-3 py-2 rounded-full text-xs opacity-0 pointer-events-none transition-opacity whitespace-nowrap z-10 ${isOwn ? "left-2" : "right-2"}`;
                swipeIndicator.textContent = "↩️ Reply";
                messageDiv.appendChild(swipeIndicator);
            }

            // If message is a reply to another message, show quoted snippet
            if (message.replyToUsername || message.replyToText) {
                const replyQuote = document.createElement("div");
                replyQuote.className = "text-xs text-gray-500 dark:text-gray-400 opacity-90 px-3 py-1 rounded-lg mb-1 bg-black/5 dark:bg-white/10 max-w-[80%] truncate";
                const who = message.replyToUsername
                    ? `${message.replyToUsername}: `
                    : "";
                const txt = message.replyToText || "";
                replyQuote.textContent = `${who}${txt}`;
                messageDiv.appendChild(replyQuote);
            }

            const bubble = document.createElement("div");
            bubble.className = `max-w-[85%] md:max-w-[70%] px-4 py-2 rounded-2xl break-words shadow-sm ${isOwn ? "bg-teal-600 text-white rounded-br-none" : "bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-bl-none"}`;
            bubble.textContent = message.text;

            const info = document.createElement("div");
            info.className = "text-[10px] text-gray-500 dark:text-gray-400 mt-1 mx-1 flex items-center gap-1";
            const date = new Date(message.timestamp);
            const timeString = date.toLocaleTimeString("en-US", {
                hour: "2-digit",
                minute: "2-digit",
            });
            info.textContent = `${isOwn ? "You" : message.username} - ${timeString}`;

            // Reply button
            const replyBtn = document.createElement("button");
            replyBtn.className = "ml-2 text-gray-400 hover:text-teal-600 transition-colors";
            replyBtn.title = "Reply to this";
            replyBtn.textContent = "↩️";
            replyBtn.addEventListener("click", () => {
                setReply(message.username, message.text);
            });
            info.appendChild(replyBtn);

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(info);

            // Swipe-to-reply eseménykezelő (csak mobilon, minden üzenetre)
            if (isMobileDevice()) {
                initSwipeToReply(messageDiv, message, isOwn);
            }

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            maybeShowNotification(message);
        }

        // Swipe-to-reply funkció mobilon
        function initSwipeToReply(messageElement, message, isOwn) {
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let isSwiping = false;
            const SWIPE_THRESHOLD = 50; // Minimum swipe távolság
            const SWIPE_MAX = 80; // Maximum eltolás

            messageElement.addEventListener(
                "touchstart",
                (e) => {
                    if (e.touches.length !== 1) return;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                    isSwiping = false;
                },
                { passive: true },
            );

            messageElement.addEventListener(
                "touchmove",
                (e) => {
                    if (e.touches.length !== 1) return;
                    currentX = e.touches[0].clientX;
                    const deltaX = currentX - startX;
                    const deltaY = Math.abs(e.touches[0].clientY - startY);

                    // Csak vízszintes swipe, ha elég nagy a vízszintes eltolás és kicsi a függőleges
                    if (Math.abs(deltaX) > 10 && deltaY < Math.abs(deltaX) * 0.5) {
                        isSwiping = true;

                        // Saját üzenetekre: balra swipe (negatív deltaX)
                        // Mások üzeneteire: jobbra swipe (pozitív deltaX)
                        if (isOwn && deltaX < 0) {
                            const swipeAmount = Math.min(Math.abs(deltaX), SWIPE_MAX);
                            messageElement.style.transform = `translateX(-${swipeAmount}px)`;
                            messageElement.classList.add("swiping");
                        } else if (!isOwn && deltaX > 0) {
                            const swipeAmount = Math.min(deltaX, SWIPE_MAX);
                            messageElement.style.transform = `translateX(${swipeAmount}px)`;
                            messageElement.classList.add("swiping");
                        }
                    }
                },
                { passive: true },
            );

            messageElement.addEventListener(
                "touchend",
                (e) => {
                    const deltaX = currentX - startX;

                    // Saját üzenetekre: balra swipe aktiválja a választ
                    // Mások üzeneteire: jobbra swipe aktiválja a választ
                    const swipeTriggered = isOwn
                        ? isSwiping && deltaX < -SWIPE_THRESHOLD
                        : isSwiping && deltaX > SWIPE_THRESHOLD;

                    if (swipeTriggered) {
                        // Swipe sikeres - válasz beállítása
                        setReply(message.username, message.text);
                        // Haptic feedback (ha elérhető)
                        if ("vibrate" in navigator) {
                            navigator.vibrate(50);
                        }
                    }

                    // Reset
                    messageElement.style.transform = "";
                    messageElement.classList.remove("swiping");
                    isSwiping = false;
                    startX = 0;
                    currentX = 0;
                },
                { passive: true },
            );
        }

        function setReply(username, text) {
            currentReply = { username, text };
            replyPreviewText.textContent = `Replying to: ${username} — ${text}`;
            replyPreview.classList.remove("hidden");
            replyPreview.setAttribute("aria-hidden", "false");
            messageInput.focus();
        }

        function clearReply() {
            currentReply = null;
            replyPreviewText.textContent = "";
            replyPreview.classList.add("hidden");
            replyPreview.setAttribute("aria-hidden", "true");
        }

        // --- PWA Service Worker Regisztráció ---
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("/service-worker.js")
                    .then((registration) => {
                        console.log("Service Worker registered:", registration.scope);
                    })
                    .catch((error) => {
                        console.log("Service Worker registration failed:", error);
                    });
            });
        }

        // --- PWA Install Prompt Kezelés ---
        let deferredPrompt;
        const installButton = document.createElement("button");
        installButton.textContent = "📱 Install";
        installButton.className = "w-full p-3 mt-4 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors font-semibold";
        installButton.style.display = "none";
        installButton.style.marginTop = "1rem";
        installButton.addEventListener("click", async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log("Install choice:", outcome);
                deferredPrompt = null;
                installButton.style.display = "none";
            }
        });

        window.addEventListener("beforeinstallprompt", (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Csak mobilon mutatjuk az install gombot
            if (isMobileDevice()) {
                const pinScreen = document.getElementById("pin-screen");
                if (pinScreen && !pinScreen.classList.contains("hidden")) {
                    pinScreen.appendChild(installButton);
                    installButton.style.display = "block";
                }
            }
        });

        window.addEventListener("appinstalled", () => {
            console.log("PWA installed");
            deferredPrompt = null;
            if (installButton.parentNode) {
                installButton.parentNode.removeChild(installButton);
            }
        });
    </script>
</body>

</html>
